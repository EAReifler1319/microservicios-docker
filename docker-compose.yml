# Orquestación de los 4 microservicios
# Cada API tiene su propio contenedor, su propio puerto y su propio volumen con su base SQLite.

services:

  users-api:                       # Python (FastAPI)
    build: ./users-api             # usa users-api/Dockerfile
    container_name: users-api
    ports:
      - "8000:8000"                # puerto_local:puerto_contenedor
    environment:
      - DB_PATH=/app/data/users.db
    volumes:
      - users_data:/app/data       # aquí se guarda users.db
    restart: unless-stopped

  auth-api:                        # Java (Javalin)
    build: ./auth-api
    container_name: auth-api
    ports:
      - "8001:8001"
    environment:
      - DB_PATH=/app/data/auth.db
    volumes:
      - auth_data:/app/data        # aquí se guarda auth.db
    restart: unless-stopped

  orders-api:                      # Go (net/http)
    build: ./orders-api
    container_name: orders-api
    ports:
      - "8002:8002"
    environment:
      - DB_PATH=/app/data/orders.db
    volumes:
      - orders_data:/app/data      # aquí se guarda orders.db
    restart: unless-stopped

  products-api:                    # JavaScript (Express)
    build: ./products-api
    container_name: products-api
    ports:
      - "8003:8003"
    environment:
      - DB_PATH=/app/data/products.db
    volumes:
      - products_data:/app/data    # aquí se guarda products.db
    restart: unless-stopped

# Volúmenes persistentes: uno por servicio, no se comparten.
# Sobreviven aunque se detengan, eliminen o recreen los contenedores.
volumes:
  users_data:
  auth_data:
  orders_data:
  products_data:
